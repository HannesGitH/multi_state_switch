name: Publish to pub.dev

# Needs automated publishing enabled for this repo on
# https://pub.dev/packages/multi_state_switch/admin (tag pattern: v{{version}}).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC authentication with pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Provides the pub.dev OIDC token.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: '[See changelog on pub.dev](https://pub.dev/packages/multi_state_switch/changelog)'
          files: CHANGELOG.md
