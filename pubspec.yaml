name: multi_state_switch
description: A Material 3 switch with any number of states (off / middle / on, ...), built on a discrete Slider so dragging, snapping and semantics come for free.
version: 1.0.0
homepage: "https://github.com/hannesgith/multi_state_switch"
repository: "https://github.com/hannesgith/multi_state_switch"
issue_tracker: "https://github.com/hannesgith/multi_state_switch/issues"
topics:
  - switch
  - toggle
  - slider
  - material
screenshots:
  - description: "Multi state switches with 2, 3 and 5 states in light and dark mode"
    path: "assets/demo.gif"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0
